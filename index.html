<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Counter</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="container">
            <ul id="comments-container" class="comments">
               
            </ul>
            
            <div id="comment-loading-message" class="hidden">Комментарий добавляется...</div>
    <form id="comment-form">
            <div class="add-form">
                <input
                    type="text"
                    class="add-form-name"
                    id="new-comment-name"
                    placeholder="Введите ваше имя"
                />
                <textarea
                    type="textarea"
                    class="add-form-text"
                    id="new-comment"
                    placeholder="Введите ваш коментарий"
                    rows="4"
                ></textarea>
                <div class="add-form-row">
                    <button id="add-comment" class="add-form-button">
                        Написать
                    </button>
                </div>
            </div>
        </div>
        <div id="app"></div>
        <script type="module" src="index.js"></script>
    </body>
</html>
